<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chasing Rioters</title>
  <!--
  La base du 4 novembre : snake.js est le Snake en objets vu le 14 octobre, à l'octet.
  Tout ce que vous allez écrire est dans snake.js. Elle s'ouvre par double-clic, sans serveur.
-->
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #08121a;
      color: #cfe3ee;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    canvas {
      border: 2px solid #1d3a4d;
      border-radius: 6px;
      max-width: 100%;
    }

    p {
      margin: 0;
      color: #7fa3b8;
      text-align: center;
    }

    kbd {
      font: inherit;
      font-size: .85em;
      background: #12222e;
      border: 1px solid #24404f;
      border-radius: 4px;
      padding: .1em .4em;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #reglages {
      position: fixed;
      top: 1rem;
      right: 1rem;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      color: #cfe3ee;
      background: #12222e;
      border: 1px solid #24404f;
      border-radius: 6px;
      padding: .2rem .55rem;
    }

    #reglages:hover,
    .mode:hover {
      border-color: #3dbe8b;
    }

    .modes {
      display: flex;
      gap: .5rem;
    }

    .mode {
      font: inherit;
      color: #cfe3ee;
      background: #12222e;
      cursor: pointer;
      border: 1px solid #24404f;
      border-radius: 6px;
      padding: .3rem .9rem;
    }

    .mode.actif {
      border-color: #3dbe8b;
      color: #3dbe8b;
    }

    #panneau {
      position: fixed;
      top: 3.6rem;
      right: 1rem;
      width: 15rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      padding: .8rem;
      background: #12222e;
      border: 1px solid #24404f;
      border-radius: 6px;
    }

    #panneau[hidden] {
      display: none;
    }

    #panneau label {
      display: flex;
      flex-direction: column;
      font-size: .85em;
      color: #7fa3b8;
      gap: .2rem;
    }

    #panneau select {
      font: inherit;
      color: #cfe3ee;
      background: #08121a;
      border: 1px solid #24404f;
      border-radius: 4px;
      padding: .25rem;
    }
  </style>
</head>

<body>

  <h1>Chasing Rioters</h1>
  <canvas id="jeu" width="720" height="720"></canvas>
  <div class="modes">
    <button class="mode actif" data-joueurs="1">Un joueur</button>
    <button class="mode" data-joueurs="2">Deux joueurs</button>
  </div>
  <p>Touches au choix dans &#9881; &middot; <kbd>R</kbd> pour rejouer &middot; <kbd>F12</kbd> : <code>plateau</code>
    dans la console</p>

  <button id="reglages" title="Réglages">&#9881;</button>
  <div id="panneau" hidden>
    <label>Skin des CRS
      <select id="skin"></select>
    </label>
    <label>Touches
      <select id="touches"></select>
    </label>
    <label>Arrière-plan
      <select id="fond"></select>
    </label>
    <select id="musique">
      <option value="willofthepeople">Muse - Will of the People</option>
      <option value="hungergames">Hunger Games - The Hanging Tree</option>
      <option value="noheavennohell"> Alex Norre - No Heaven, No Hell</option>
    </select>
  </div>

  <script src="verifier.js"></script> <!-- le vérificateur -->
  <script src="snake.js"></script>
</body>

</html>
